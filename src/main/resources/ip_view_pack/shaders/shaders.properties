# Immersive Portals: Aeronautics: the pack nested portal views are drawn with while the player's view keeps the
# player's pack (IPIrisViewPack). No shadow pass, no deferred or composite passes; every program not here falls back
# to Iris's built-in vanilla-like shaders. Iris's world settings (AO, shading, block ids, vertex format) stay the
# player's pack's: the programs read them through IP_* defines.
shadow.enabled=false
