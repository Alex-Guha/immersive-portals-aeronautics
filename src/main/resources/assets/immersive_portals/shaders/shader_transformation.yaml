---
configs:
  - comment: For vanilla terrain rendering
    type: vs
    affectedShaders:
      - rendertype_solid
      - rendertype_cutout
      - rendertype_cutout_mipped
      - rendertype_translucent
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          uniform vec4 ipa_ShipClipEquation;
          void main() {
              gl_ClipDistance[0] = dot(Position.xyz + ChunkOffset, iportal_ClippingEquation.xyz) +
                  iportal_ClippingEquation.w;
              gl_ClipDistance[1] = dot(Position.xyz + ChunkOffset, ipa_ShipClipEquation.xyz) +
                  ipa_ShipClipEquation.w;
    debugOutput: false
  - comment: For portal area rendering and entity rendering and particle
    type: vs
    affectedShaders:
      - rendertype_entity_solid
      - rendertype_entity_cutout
      - rendertype_entity_cutout_no_cull
      - rendertype_entity_cutout_no_cull_z_offset
      - rendertype_item_entity_translucent_cull
      - rendertype_entity_translucent_cull
      - rendertype_entity_translucent
      - rendertype_entity_smooth_cutout
      - rendertype_beacon_beam",
      - rendertype_entity_translucent_emissive
      - rendertype_entity_translucent_cull
      - portal_area
      - particle
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
              gl_ClipDistance[0] = dot(Position.xyz, iportal_ClippingEquation.xyz) + 
                  iportal_ClippingEquation.w;
    debugOutput: false
  - comment: For iris+sodium
    type: vs
    affectedShaders:
      - iris_gbuffers_terrain
      - iris_gbuffers_water
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
      - pattern: "\\}(?![\\S\\s]*\\})"
        # match the last } ([\S\s] matches any character). use the modelview-transformed coordinate
        replacement: |-
          gl_ClipDistance[0] = dot(
              (iris_ModelViewMatrix * getVertexPosition()).xyz, iportal_ClippingEquation.xyz
          ) + iportal_ClippingEquation.w;
          }
    debugOutput: false
  - comment: >-
      Immersive Aeronautics: an Iris shader pack's vanilla-path terrain programs (they draw Sable ships with a pack),
      like the vanilla terrain entry. Iris's ShaderInstance.getUniform prefixes names with iris_, hence the ship plane's
      name. ShaderCodeTransformation.IRIS_TERRAIN_SHADERS lists them for MixinShaderInstance.
    type: vs
    affectedShaders:
      - iris_terrain_solid
      - iris_terrain_cutout
      - iris_terrain_translucent
      - iris_moving_block
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          uniform vec4 iris_ipa_ShipClipEquation;
          void main() {
              gl_ClipDistance[0] = dot(iris_Position + iris_ChunkOffset, iportal_ClippingEquation.xyz) +
                  iportal_ClippingEquation.w;
              gl_ClipDistance[1] = dot(iris_Position + iris_ChunkOffset, iris_ipa_ShipClipEquation.xyz) +
                  iris_ipa_ShipClipEquation.w;
    debugOutput: false
  - comment: For sodium
    type: vs
    affectedShaders:
      - sodium:blocks/block_layer_opaque.vsh
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement:
          uniform vec4 iportal_ClippingEquation;
          void main() {
      - pattern: "\\}(?![\\S\\s]*\\})"
        # match the last } ([\S\s] matches any character). use the modelview-transformed coordinate
        replacement: |-
          gl_ClipDistance[0] = dot(
              (u_ModelViewMatrix * vec4(position, 1.0)).xyz, iportal_ClippingEquation.xyz
          ) + iportal_ClippingEquation.w;
          }
    debugOutput: false
