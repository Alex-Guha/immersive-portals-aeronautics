plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
    id 'net.neoforged.gradle.mixin' version '7.0.165'
}

apply plugin: 'java-library'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'net.neoforged.gradle.userdev'
apply plugin: 'net.neoforged.gradle.mixin'

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name "tterrag maven"
        url "https://maven.tterrag.com/"
    }

    flatDir {
        dir "deps"
    }
}

base {
    archivesName = archives_base_name
}

jarJar.enable()

minecraft.accessTransformers.entry 'public net.minecraft.server.MinecraftServer storageSource'
minecraft.accessTransformers.entry 'public net.minecraft.world.level.biome.BiomeManager biomeZoomSeed'
minecraft.accessTransformers.entry 'public-f net.minecraft.util.profiling.ActiveProfiler WARNING_TIME_NANOS'
minecraft.accessTransformers.entry 'public net.minecraft.server.level.ChunkMap$TrackedEntity'
minecraft.accessTransformers.entry 'public net.minecraft.world.level.GameRules register(Ljava/lang/String;Lnet/minecraft/world/level/GameRules$Category;Lnet/minecraft/world/level/GameRules$Type;)Lnet/minecraft/world/level/GameRules$Key;'
minecraft.accessTransformers.entry 'public net.minecraft.world.level.GameRules$BooleanValue create(Z)Lnet/minecraft/world/level/GameRules$Type;'
minecraft.accessTransformers.entry 'public com.mojang.blaze3d.shaders.Program$Type getGlType()I'
minecraft.accessTransformers.entry 'public-f net.minecraft.world.entity.Entity getBoundingBox()Lnet/minecraft/world/phys/AABB;'

minecraft.accessTransformers.entry 'public net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection$CompileTask'
minecraft.accessTransformers.entry 'public-f net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator'
minecraft.accessTransformers.entry 'public net.minecraft.resources.RegistryDataLoader$Loader'
minecraft.accessTransformers.entry 'public net.minecraft.client.gui.screens.worldselection.CreateWorldScreen$MoreTab'
minecraft.accessTransformers.entry 'public net.minecraft.client.multiplayer.ClientChunkCache emptyChunk'
minecraft.accessTransformers.entry 'public net.minecraft.client.multiplayer.ClientChunkCache lightEngine'
minecraft.accessTransformers.entry 'public net.minecraft.client.multiplayer.ClientChunkCache storage'
minecraft.accessTransformers.entry 'public net.minecraft.client.multiplayer.ClientChunkCache level'

minecraft.accessTransformers.entry 'public net.minecraft.world.entity.EntityType$Builder dimensions'

minecraft.accessTransformers.entry 'public net.minecraft.util.datafix.fixes.ItemStackComponentizationFix$ItemStackData'

/*sourceSets {
    main {
        java {
            srcDir "src/main/java"
        }
        resources {
            srcDir "src/main/resources"
        }
    }
}*/

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        getArguments().addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Immersive Aeronautics: -PwithoutVoxy builds without the Voxy compat (compat/mixin_voxy, compat/voxy_integration and
// their mixin config), for a clone without the Roxy-patched Voxy jar in deps/ that it compiles against: CI, and anyone
// but the maintainer. Never for a release: such a jar has no Voxy support at all. Nothing else names those classes
// (IPIrisPortalViewPipelines finds IPVoxyIrisPipelines by name).
def withoutVoxy = project.hasProperty('withoutVoxy')
if (withoutVoxy) {
    sourceSets.main.java {
        exclude 'qouteall/imm_ptl/core/compat/mixin_voxy/**', 'qouteall/imm_ptl/core/compat/voxy_integration/**'
    }
    sourceSets.main.resources { exclude 'imm_ptl_voxy_compat.mixins.json' }
    logger.warn('-PwithoutVoxy: this jar has no Voxy compat; never release it')
}

mixin {
    configs.add("imm_ptl_peripheral.mixins.json")
    configs.add("q_misc_util.mixins.json")
    configs.add("imm_ptl.mixins.json")
    configs.add("imm_ptl_compat.mixins.json")
    configs.add("imm_ptl_fabric.mixins.json")
    configs.add("imm_ptl_sable_compat.mixins.json")
    configs.add("imm_ptl_create_compat.mixins.json")
    configs.add("imm_ptl_dh_compat.mixins.json")
    if (!withoutVoxy) configs.add("imm_ptl_voxy_compat.mixins.json")
    configs.add("imm_ptl_physicsmod_compat.mixins.json")
    configs.add("imm_ptl_render_tweaks.mixins.json")
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Sodium/Iris versions the portal rendering compat is verified against
    implementation "maven.modrinth:sodium:mc1.21.1-0.8.13-neoforge"
    implementation "maven.modrinth:iris:1.8.14-beta.1+1.21.1-neoforge"

    implementation "maven.modrinth:pehkui:3.8.3+1.21-neoforge"

    // Create (brings Flywheel, Ponder, Registrate transitively)
    implementation "maven.modrinth:create:UjX6dr61"

    // Optional compat targets of the Immersive Aeronautics integration (compile-only)
    compileOnly "maven.modrinth:sable:fg9dTRz9"                 // Sable 2.0.6 (NeoForge); bundles Veil 4.3.2 + sable-companion 1.6.0 as jar-in-jar
    compileOnly "maven.modrinth:create-aeronautics:44pLdPGg"    // Create Aeronautics 1.3.2 (bundled)
    compileOnly "maven.modrinth:distanthorizons:9w34y8ai"       // Distant Horizons 3.3.3
    compileOnly "maven.modrinth:sable-ragdolls:CyKh8XSr"        // Sable Player Ragdoll 0.7.5
    compileOnly "maven.modrinth:sodium-dynamic-lights:XI0WLXdn" // SodiumDynamicLights 1.0.10 (NeoForge 1.21.1)
    compileOnly "maven.modrinth:colorwheel:lV874ox8"            // Colorwheel 1.3.2+mc1.21.1 (NeoForge): Flywheel under Iris packs
    compileOnly "maven.modrinth:create-teleporters:WHTovylv"    // Create: Teleporters 3.0.1b
    compileOnly "maven.modrinth:create-pipes-n-physics:kH90vhqN" // Create: Pipes'n physics 3.2.1

    // Unit tests (./gradlew test, part of build): plain JUnit on classes that need no running game
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Nested jar-in-jar classes of Sodium/Iris/Sable, extracted by scripts/extract-nested-deps.sh
    compileOnly fileTree(dir: 'deps', include: '*.jar')
}

tasks.named('build').configure { dependsOn('jarJar') }

// Downloads the mods we compile against from Modrinth into Gradle's cache, without the rest of the build, so that
// scripts/extract-nested-deps.sh finds their jars on a fresh machine (CI): `./gradlew downloadModJars`
tasks.register('downloadModJars') {
    doLast {
        def mods = configurations.compileClasspath.allDependencies.findAll { it.group == 'maven.modrinth' }*.copy()
        def jars = configurations.detachedConfiguration(*mods).tap { transitive = false }.files
        logger.lifecycle("${jars.size()} mod jars in Gradle's cache")
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// The compile classpath as one colon-separated line in build/ipa/compile-classpath.txt, for scripts/check.sh: mixincheck.py
// checks our mixin targets against exactly these jars (NeoGradle's named Minecraft+NeoForge jar among them). Written by
// every build, so check.sh needs no Gradle run of its own.
def writeCompileClasspath = tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('ipa/compile-classpath.txt')
    def classpath = sourceSets.main.compileClasspath
    inputs.files(classpath)
    outputs.file(out)
    doLast {
        out.get().asFile.text = classpath.files.findAll { it.name.endsWith('.jar') }*.absolutePath.join(':') + '\n'
    }
}
tasks.named('jar').configure { finalizedBy(writeCompileClasspath) }

// build/libs keeps only the jars of the version being built: a version bump leaves no old jar behind
def removeOldJars = tasks.register('removeOldJars', Delete) {
    delete fileTree(layout.buildDirectory.dir('libs')) {
        include "${archives_base_name}-*.jar"
        exclude "${archives_base_name}-${version}.jar", "${archives_base_name}-${version}-*.jar"
    }
}
tasks.named('jar').configure { dependsOn(removeOldJars) }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range, issue_tracker_url: issue_tracker_url,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_credits: mod_credits, mod_version: mod_version,
            ip_api_version      : ip_api_version,
            // the [[mixins]] entry of the Voxy compat, none without it (-PwithoutVoxy)
            voxy_mixins         : withoutVoxy ? '' : '[[mixins]]\nconfig="imm_ptl_voxy_compat.mixins.json"',
            mod_authors         : mod_authors, mod_description: mod_description, pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
// Immersive Aeronautics: ship both licences and the attribution notice inside every jar (Apache-2.0 §4,
// PolyForm Shield "Notices"): LICENSE is PolyForm Shield (our code and the Sable copy), LICENSE-APACHE covers the
// code taken from Immersive Portals, Immersive Aeronautics, IPSable and Rapier. NOTICE says which is which.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('LICENSE-APACHE')) { into 'META-INF' }
    from(rootProject.file('NOTICE')) { into 'META-INF' }
}

// Seamless ship crossings: the ipa_rapier library (natives/) is copied from Sable's and stays under Sable's PolyForm
// Shield licence, the same text as META-INF/LICENSE; Sable's own Java classes drive it. Its native libraries are built by
// scripts/build-natives.sh; a jar without all six falls back to Sable's stock physics on the missing platforms,
// so the build refuses to package one unless -PallowMissingNatives is given.
def ipaRapierNatives = ['x86_64_linux.so', 'aarch64_linux.so', 'x86_64_macos.dylib', 'aarch64_macos.dylib',
                        'x86_64_windows.dll', 'aarch64_windows.dll'].collect { "src/main/resources/natives/ipa_rapier/ipa_rapier_$it" }
tasks.named('processResources').configure {
    dependsOn('checkNativesSource')
    doFirst {
        def missing = ipaRapierNatives.findAll { !rootProject.file(it).exists() }
        if (!missing.isEmpty()) {
            if (project.hasProperty('allowMissingNatives')) {
                logger.warn("ipa_rapier natives missing (stock Sable physics there): ${missing}")
            } else {
                throw new GradleException("ipa_rapier natives missing: ${missing}. Run scripts/build-natives.sh, or build with -PallowMissingNatives")
            }
        }
    }
}

// Natives tied to their source: scripts/build-natives.sh writes, next to the libraries, SOURCE-HASH with one line per
// library it built, "<source hash>  <library>", the source hash being scripts/natives-hash.sh's (a sha256 over every
// tracked file of natives/, path and contents, as they are in the working tree). The build refuses a library whose line
// is missing or names another hash: natives/ changed and build-natives.sh was not run, so the jar would ship the old
// physics. -PallowStaleNatives packages them anyway (a quick test of Java changes beside unbuilt native ones). The
// same hash keys CI's natives cache.
def nativesSourceHash = {
    def git = ['git', 'ls-files', '-z', 'natives'].execute(null, rootProject.projectDir)
    def listing = git.inputStream.text
    if (git.waitFor() != 0) return null
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    // the lines of "sha256sum" over the files in byte order of their paths, as natives-hash.sh feeds them
    listing.split('\u0000').findAll { it }.sort().each { path ->
        def fileHash = java.security.MessageDigest.getInstance('SHA-256').digest(rootProject.file(path).bytes).encodeHex().toString()
        digest.update("${fileHash}  ${path}\n".getBytes('UTF-8'))
    }
    digest.digest().encodeHex().toString()
}
tasks.register('checkNativesSource') {
    outputs.upToDateWhen { false }   // cheap, and its input (natives/) is not processResources'
    doLast {
        def present = ipaRapierNatives.findAll { rootProject.file(it).exists() }
        if (present.isEmpty()) return
        def expected = nativesSourceHash()
        if (expected == null) {
            logger.warn('not a git checkout: the natives are not checked against natives/')
            return
        }
        def stampFile = rootProject.file('src/main/resources/natives/ipa_rapier/SOURCE-HASH')
        def stamped = stampFile.exists() ? stampFile.readLines().findAll { it.trim() }.collectEntries {
            def (hash, name) = it.split(/\s+/, 2); [(name): hash] } : [:]
        def stale = present.collect { rootProject.file(it).name }.findAll { stamped[it] != expected }
        if (stale.isEmpty()) return
        def message = "ipa_rapier natives not built from the natives/ in this checkout: ${stale}. Run scripts/build-natives.sh"
        if (project.hasProperty('allowStaleNatives')) {
            logger.warn("${message} (-PallowStaleNatives: packaged anyway)")
        } else {
            throw new GradleException("${message}, or build with -PallowStaleNatives")
        }
    }
}
